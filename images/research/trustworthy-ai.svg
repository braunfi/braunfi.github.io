<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <style>
      .bg { fill: #f0ece4; }
      .p  { fill: #5a1a7a; }
      .s  { stroke: #5a1a7a; fill: none; }
      .a  { fill: #5a1a7a; fill-opacity: .12; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #262520; }
        .p  { fill: #c084fc; }
        .s  { stroke: #c084fc; fill: none; }
        .a  { fill: #c084fc; fill-opacity: .12; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" class="bg"/>

  <!-- Central shield -->
  <path d="M200 30 L248 30 L248 100 Q248 150 200 175 Q152 150 152 100 L152 30 Z" class="a"/>
  <path d="M200 30 L248 30 L248 100 Q248 150 200 175 Q152 150 152 100 L152 30 Z" class="s" stroke-width="2.5"/>
  <!-- Checkmark in shield -->
  <polyline points="178,96 194,115 226,72" class="s" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left speech bubble -->
  <rect x="20" y="58" width="110" height="62" rx="10" class="a"/>
  <rect x="20" y="58" width="110" height="62" rx="10" class="s" stroke-width="2"/>
  <polygon points="118,98 140,110 120,110" class="a"/>
  <polygon points="118,98 140,110 120,110" class="s" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lines inside (text representation) -->
  <line x1="35" y1="77" x2="115" y2="77" class="s" stroke-width="2"   stroke-linecap="round" opacity=".6"/>
  <line x1="35" y1="91" x2="100" y2="91" class="s" stroke-width="2"   stroke-linecap="round" opacity=".6"/>
  <line x1="35" y1="105" x2="90" y2="105" class="s" stroke-width="2"  stroke-linecap="round" opacity=".4"/>

  <!-- Right speech bubble -->
  <rect x="270" y="58" width="110" height="62" rx="10" class="a"/>
  <rect x="270" y="58" width="110" height="62" rx="10" class="s" stroke-width="2"/>
  <polygon points="282,98 260,110 280,110" class="a"/>
  <polygon points="282,98 260,110 280,110" class="s" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lines inside -->
  <line x1="285" y1="77" x2="365" y2="77" class="s" stroke-width="2"  stroke-linecap="round" opacity=".6"/>
  <line x1="285" y1="91" x2="350" y2="91" class="s" stroke-width="2"  stroke-linecap="round" opacity=".6"/>
  <line x1="285" y1="105" x2="325" y2="105" class="s" stroke-width="2" stroke-linecap="round" opacity=".4"/>

  <!-- Person icons (recipients) -->
  <!-- Left person -->
  <circle cx="75" cy="162" r="14" class="s" stroke-width="2"/>
  <path d="M50 200 Q50 178 75 178 Q100 178 100 200" class="s" stroke-width="2"/>
  <!-- Right person -->
  <circle cx="325" cy="162" r="14" class="s" stroke-width="2"/>
  <path d="M300 200 Q300 178 325 178 Q350 178 350 200" class="s" stroke-width="2"/>

  <!-- Connecting lines from shield to bubbles -->
  <line x1="153" y1="88" x2="130" y2="89" class="s" stroke-width="1.5" opacity=".5" stroke-dasharray="4 3"/>
  <line x1="248" y1="88" x2="270" y2="89" class="s" stroke-width="1.5" opacity=".5" stroke-dasharray="4 3"/>
</svg>
