<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <style>
      .bg { fill: #f0ece4; }
      .p  { fill: #5a1a7a; }
      .s  { stroke: #5a1a7a; fill: none; }
      .a  { fill: #5a1a7a; fill-opacity: .12; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #262520; }
        .p  { fill: #c084fc; }
        .s  { stroke: #c084fc; fill: none; }
        .a  { fill: #c084fc; fill-opacity: .12; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" class="bg"/>

  <!-- === Neural network === -->

  <!-- Layer 1 — input (x=65) -->
  <circle cx="65" cy="60"  r="13" class="a"/>
  <circle cx="65" cy="60"  r="13" class="s" stroke-width="2"/>
  <circle cx="65" cy="110" r="13" class="a"/>
  <circle cx="65" cy="110" r="13" class="s" stroke-width="2"/>
  <circle cx="65" cy="160" r="13" class="a"/>
  <circle cx="65" cy="160" r="13" class="s" stroke-width="2"/>

  <!-- Layer 2 — hidden (x=185) -->
  <circle cx="185" cy="45"  r="13" class="a"/>
  <circle cx="185" cy="45"  r="13" class="s" stroke-width="2"/>
  <circle cx="185" cy="95"  r="13" class="a"/>
  <circle cx="185" cy="95"  r="13" class="s" stroke-width="2"/>
  <circle cx="185" cy="145" r="13" class="a"/>
  <circle cx="185" cy="145" r="13" class="s" stroke-width="2"/>
  <circle cx="185" cy="190" r="13" class="a"/>
  <circle cx="185" cy="190" r="13" class="s" stroke-width="2"/>

  <!-- Layer 3 — output (x=305) -->
  <circle cx="305" cy="75"  r="13" class="a"/>
  <circle cx="305" cy="75"  r="13" class="s" stroke-width="2"/>
  <circle cx="305" cy="145" r="13" class="a"/>
  <circle cx="305" cy="145" r="13" class="s" stroke-width="2"/>

  <!-- L1 → L2 connections (faint) -->
  <line x1="78"  y1="60"  x2="172" y2="45"  class="s" stroke-width="1" opacity=".3"/>
  <line x1="78"  y1="60"  x2="172" y2="95"  class="s" stroke-width="1" opacity=".3"/>
  <line x1="78"  y1="60"  x2="172" y2="145" class="s" stroke-width="1" opacity=".3"/>
  <line x1="78"  y1="110" x2="172" y2="45"  class="s" stroke-width="1" opacity=".3"/>
  <line x1="78"  y1="110" x2="172" y2="95"  class="s" stroke-width="1.5" opacity=".55"/>
  <line x1="78"  y1="110" x2="172" y2="145" class="s" stroke-width="1" opacity=".3"/>
  <line x1="78"  y1="110" x2="172" y2="190" class="s" stroke-width="1" opacity=".2"/>
  <line x1="78"  y1="160" x2="172" y2="95"  class="s" stroke-width="1" opacity=".3"/>
  <line x1="78"  y1="160" x2="172" y2="145" class="s" stroke-width="1" opacity=".3"/>
  <line x1="78"  y1="160" x2="172" y2="190" class="s" stroke-width="1" opacity=".3"/>

  <!-- L2 → L3 connections (faint) -->
  <line x1="198" y1="45"  x2="292" y2="75"  class="s" stroke-width="1" opacity=".3"/>
  <line x1="198" y1="95"  x2="292" y2="75"  class="s" stroke-width="1.5" opacity=".55"/>
  <line x1="198" y1="145" x2="292" y2="145" class="s" stroke-width="1" opacity=".3"/>
  <line x1="198" y1="190" x2="292" y2="145" class="s" stroke-width="1" opacity=".3"/>
  <line x1="198" y1="95"  x2="292" y2="145" class="s" stroke-width="1" opacity=".2"/>
  <line x1="198" y1="45"  x2="292" y2="145" class="s" stroke-width="1" opacity=".15"/>

  <!-- === Magnifying glass zooming in on node cx=185 cy=95 === -->
  <!-- Lens circle -->
  <circle cx="185" cy="95" r="42" class="s" stroke-width="2.5" opacity=".7"/>
  <!-- Lens fill (light tint to show "glass") -->
  <circle cx="185" cy="95" r="42" fill="currentColor" fill-opacity=".03"/>
  <!-- Handle -->
  <line x1="218" y1="128" x2="248" y2="158" class="s" stroke-width="5" stroke-linecap="round"/>

  <!-- Highlighted node inside lens (redraw on top) -->
  <circle cx="185" cy="95" r="13" class="a"/>
  <circle cx="185" cy="95" r="13" class="s" stroke-width="2.5"/>
  <circle cx="185" cy="95" r="5" class="p"/>

  <!-- Annotation label (box with lines) pointing to node -->
  <rect x="305" y="180" width="78" height="30" rx="5" class="a"/>
  <rect x="305" y="180" width="78" height="30" rx="5" class="s" stroke-width="1.5"/>
  <line x1="220" y1="122" x2="305" y2="188" class="s" stroke-width="1.5" stroke-dasharray="4 3" opacity=".6"/>
  <line x1="315" y1="189" x2="373" y2="189" class="s" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <line x1="315" y1="200" x2="358" y2="200" class="s" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
</svg>
